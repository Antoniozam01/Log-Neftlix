<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/06-Netflix/style.css" />
    <title>Inicio de Sesion</title>
  </head>
  <body>
    <div class="login-container">
      <div class="login-form"></div>
      <div class="logo-container">
        <img src="logo-neflix.png" alt="" />
      </div>
      <h1>Iniciar Sesion</h1>
      <form id="login-form">
        <div class="input-container">
          <input type="text" id="username" placeholder="Username" />
        </div>
        <div class="input-container">
          <input type="password" id="password" placeholder="Password" />
        </div>
        <button type="submit">Iniciar Sesion</button>
      </form>
      <div class="sucess-message" id="sucess-message"></div>
      <div class="remember-forgot">
        <label>
          <input type="checkbox" id="remember-forgot" />Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="signup-now">¿Nuevo en Netflix? <a href="#">¡Suscríbete ahora!</a></div>
    </div>

    <script src="/06-Netflix/script.js"></script>
  </body>
</html>
